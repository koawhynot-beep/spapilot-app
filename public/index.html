<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2efe9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mitra Samadi" />
    <meta name="description" content="Multi-shop inventory tracking made simple." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Mitra Samadi</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Saved choice wins; otherwise follow the device setting.
      (function () {
        try {
          var saved = localStorage.getItem('ms-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) { /* private mode / blocked storage — light is fine */ }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
